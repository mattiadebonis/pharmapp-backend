events {}

http {
    upstream postgrest_backend {
        server pharma-test-rest:3000;
    }

    server {
        listen 80;

        # supabase-py prepends /rest/v1; rewrite to PostgREST root.
        location ~ ^/rest/v1/(.*)$ {
            proxy_pass http://postgrest_backend/$1$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
